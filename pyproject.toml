[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simquaro"
version = "0.1.0"
description = "Deterministic standalone hardware simulator for Synqaro development"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
simquaro = "simquaro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["simquaro*", "synqaro_protocol*"]
