[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synqaro"
version = "0.1.0"
description = "Hardware control interfaces and deterministic simulators for Synqaro"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["PyYAML>=6,<7", "jsonschema>=4.18,<5", "httpx>=0.27,<1", "playwright>=1.48,<2", "pytest>=8.3,<10"]

[project.scripts]
synqaro = "synqaro.cli:main"
simquaro = "simquaro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["synqaro*", "simquaro*"]

[tool.setuptools.package-data]
"synqaro.web" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["src"]
