schema_version: 1
id: fictitious_receiver
revision: '0.2'
status: approved
hardware:
  model: fictitious_receiver
  description: Fictitious tuning-only receiver; no physical instrument or scientific acquisition. No real
    firmware release has been verified against this contract. The simulator is a test implementation,
    not a certified firmware release.
  firmware_versions: []
