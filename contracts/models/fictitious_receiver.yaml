      scope and review.
  device_configuration:
    question: How will Device cache, thresholds and configuration history be implemented and verified?
    impact: Device-owned settings and audit infrastructure are distinct from hardware contract; retain
      requirements in architecture/protocol.
    owner: Hardware team / project maintainer
    requirements: []
    disposition: excluded
    exclusion_reason: Outside the fictitious receiver hardware-contract approval scope; see protocol deferred
      scope and review.
  simulator_internals:
    question: Which nominal phase durations, default startup value, internal reference frequency and simulator
