    question: How will external data be associated with frequency, and how will bulk or continuous acquisition
      be transported?
    impact: No scientific association, bulk transfer or streams in tuning-only contract.
    owner: Hardware team / project maintainer
    requirements: []
    disposition: excluded
    exclusion_reason: Outside the fictitious receiver hardware-contract approval scope; see protocol deferred
      scope and review.
  physical_platform:
    question: Which real hardware, firmware platform, clock accuracy and physical measurement verification
      will apply?
    impact: Receiver is fictitious; no physical instrument, real firmware, hard real-time or physical
      clock guarantees.
    owner: Hardware team / project maintainer
    requirements: []
    disposition: excluded
    exclusion_reason: Outside the fictitious receiver hardware-contract approval scope; see protocol deferred
      scope and review.
  protection:
