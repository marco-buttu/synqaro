properties:
  configuration:
    description: Flat descriptor; object describes logical fields, not a nested JSON wire value.
    access: readonly
    value:
      type: object
      unit: null
      description: Required descriptor fields; encoded as flat protocol fields.
      fields:
        name:
          type: string
          unit: null
          description: Descriptor target.
          enum:
          - configuration
        protocol_version:
          type: integer
          unit: null
          description: Protocol version independent of firmware release.
          enum:
          - 1
        hardware_id:
          type: string
          unit: null
          description: Instance-specific apparatus identity.
          minLength: 1
        hardware_model:
          type: string
          unit: null
          description: Model identity.
          enum:
          - fictitious_receiver
        firmware_version:
          type: string
          unit: null
          description: Reported release identity; a nonempty label and matching protocol do not establish
            conformance. An empty hardware.firmware_versions list declares no verified compatible releases.
          minLength: 1
        firmware_build:
          type: string
          unit: null
          description: Unique installed build identity.
          minLength: 1
        readonly_properties:
          type: array
          unit: null
          description: Exact capability set; no duplicates; order immaterial.
          items:
            type: string
            unit: null
            description: Capability name.
            enum:
            - configuration
          minItems: 1
          maxItems: 1
        readwrite_properties:
          type: array
          unit: null
          description: Exact capability set; no duplicates; order immaterial.
          items:
            type: string
            unit: null
            description: Capability name.
            enum:
            - frequency
          minItems: 1
          maxItems: 1
        supported_procedures:
          type: array
          unit: null
          description: Exact capability set; no duplicates; order immaterial.
          items:
            type: string
            unit: null
            description: Capability name.
            enum:
            - calibrate
            - scan
          minItems: 2
          maxItems: 2
        sampled_at_properties:
          type: array
          unit: null
          description: Exact capability set; no duplicates; order immaterial.
          items:
            type: string
            unit: null
            description: Capability name.
            enum:
            - frequency
          minItems: 1
          maxItems: 1
        frequency_min:
          type: number
          unit: GHz
          description: Must equal properties.frequency.value.minimum.
        frequency_max:
          type: number
          unit: GHz
          description: Must equal properties.frequency.value.maximum.
        frequency_unit:
          type: string
          unit: null
          description: Must match frequency and scan units.
          enum:
          - GHz
        frequency_resolution:
          type: number
          unit: GHz
          description: Must equal properties.frequency.value.resolution.
        frequency_rounding:
          type: string
          unit: null
          description: Declared approximation policy.
          enum:
          - nearest_ties_up
        max_message_bytes:
          type: integer
          unit: byte
          description: Maximum frame including LF.
          enum:
          - 4096
        incomplete_message_timeout_ms:
          type: integer
          unit: ms
          description: First-byte framing deadline.
          enum:
          - 2000
        max_pending_requests:
          type: integer
          unit: null
          description: Per-connection pending ordinary responses.
          enum:
          - 4
        max_tuning_ms:
          type: integer
          unit: ms
          description: Apply and verify one frequency.
          enum:
          - 1000
        calibrate_timeout_ms:
          type: integer
          unit: ms
          description: Must equal procedures.calibrate.timing.deadline_ms.
        scan_timeout_ms:
          type: integer
          unit: ms
          description: Must equal procedures.scan.timing.deadline_ms.
        procedure_stop_timeout_ms:
          type: integer
          unit: ms
          description: Additional controlled-stop deadline.
          enum:
          - 5000
        scan_points:
          type: integer
          unit: null
          description: Fixed count including endpoints.
          enum:
          - 10
        scan_max_dwell_ms:
          type: integer
          unit: ms
          description: Must equal procedures.scan.parameters.dwell_ms.value.maximum.
        calibrate_cancellation:
          type: string
          unit: null
          description: Client cancellation except finalization.
          enum:
          - except_finalization
        scan_cancellation:
          type: string
          unit: null
          description: Client cancellation throughout active scan.
          enum:
          - always
        utc_clock_supported:
          type: boolean
          unit: null
          description: Clock capability, not current trust.
          enum:
          - true
    availability: Readable on initial connection and reconnection when communication is available.
    requirements:
    - identity
    - firmware_scope
    - wire_limits
    - time_quality
    errors:
    - READ_ONLY_PROPERTY
    - UNKNOWN_PARAMETER
    - MISSING_PARAMETER
  frequency:
    description: Current verified operating frequency.
    access: readwrite
    value:
      type: number
      unit: GHz
      description: Operating frequency and accepted set bounds.
      minimum: 1
      maximum: 10
      resolution: 1.0e-06
      representation: Validate original bounds, then round to nearest grid; ties toward higher frequency.
        Verified returned values are on grid.
    availability: Fresh acquisition when valid; unavailable during calibration (CALIBRATING), during an
      unverified tuning transition (TUNING), or after loss of verification evidence (UNVERIFIED). A failed
      acquisition reports FREQUENCY_READ_FAILED.
    write_effect: Return ok only after verified application within max_tuning_ms. Preserve calibration
      on a successful same-effective-frequency setting, invalidate it on a successful change or on failed
      application that loses frequency verification, and leave it unchanged on rejection before hardware
      effects.
    requirements:
    - frequency_range
    - frequency_write
    - uncertain_calibration
    - frequency_read
    - unverified_reason
    - concurrency
    - short_set_overlap
    - time_quality
    errors:
    - INVALID_TYPE
    - OUT_OF_RANGE
    - UNSUPPORTED_UNIT
    - INVALID_PARAMETER
    - MISSING_PARAMETER
    - UNKNOWN_PARAMETER
    - DUPLICATE_PARAMETER
    - BUSY
    - HARDWARE_FAULT
    - FREQUENCY_LOCK_FAILED
    - FREQUENCY_READ_FAILED
    - VALUE_UNAVAILABLE
procedures:
  calibrate:
    description: Calibrate using an internal reference and restore starting frequency.
    parameters: {}
    preconditions:
    - No incompatible tuning or procedure is active.
    - No known blocking hardware fault.
    effects: Invalidate prior calibration at start. Restore and verify saved frequency before success;
      failure/cancellation leaves calibration invalid.
    states:
      running: Accepted active execution, including internal phases.
      cancelling: Controlled stop requested; may persist after stop deadline without confirmation.
      succeeded: Actual successful completion.
      failed: Execution failed and stopped.
      cancelled: Accepted cancellation resulted in confirmed stop.
    initial_state: running
    terminal_states:
    - succeeded
    - failed
    - cancelled
    transitions:
    - from: running
      to: succeeded
      condition: All completion conditions verified within execution deadline.
    - from: running
      to: failed
      condition: Execution failure and confirmed stop.
    - from: running
      to: cancelling
      condition: Accepted client cancellation or execution deadline expires.
    - from: cancelling
      to: succeeded
      condition: Actual successful completion wins client cancellation race before execution deadline.
    - from: cancelling
      to: failed
      condition: Confirmed stop after execution timeout or other actual failure.
    - from: cancelling
      to: cancelled
      condition: Accepted client cancellation produces confirmed stop, without a timeout failure.
    outcomes:
      succeeded: All required effects verified. Calibration valid and saved frequency restored.
      failed: Report actual error_code, never before verified end. Calibration invalid; frequency must
        be reacquired.
      cancelled: Verified stop, no implied restoration. Calibration invalid.
    cancellation:
      supported: true
      allowed_states:
      - running
      - cancelling
      semantics: Client cancellation while running except finalization; finalization returns NOT_CANCELLABLE
        without starting stop. Repeated cancellation while cancelling is accepted without extending deadline.
        See controlled_stop.
    timing:
      deadline_ms: 30000
      completion: Execution deadline, not a guaranteed terminal-state deadline. Includes all required
        work. At expiry initiate controlled stop; after confirmed stop report CALIBRATION_TIMEOUT. Use
        descriptor procedure_stop_timeout_ms; if no stop proof, report STOP_TIMEOUT and remain nonterminal.
    requirements:
    - calibration
    - procedure_history
    - controlled_stop
    - concurrency
    - time_quality
    errors:
    - CALIBRATION_REFERENCE_UNAVAILABLE
    - CALIBRATION_TIMEOUT
    - FREQUENCY_LOCK_FAILED
    - BUSY
    - HARDWARE_FAULT
    - MISSING_PARAMETER
    - UNKNOWN_PARAMETER
    - DUPLICATE_PARAMETER
    - NOT_RUNNING
    - NOT_CANCELLABLE
    - STOP_TIMEOUT
  scan:
    description: Tune and hold exactly ten distinct frequencies.
    parameters:
      start:
        required: true
        value:
          type: number
          unit: GHz
          description: First requested endpoint.
          minimum: 1
          maximum: 10
          resolution: 1.0e-06
          representation: Validate original bounds, then round to nearest grid; ties toward higher frequency.
            Verified returned values are on grid.
      stop:
        required: true
        value:
          type: number
          unit: GHz
          description: Last requested endpoint, included.
          minimum: 1
          maximum: 10
          resolution: 1.0e-06
          representation: Validate original bounds, then round to nearest grid; ties toward higher frequency.
            Verified returned values are on grid.
      unit:
        required: true
        value:
          type: string
          unit: null
          description: Explicit wire frequency unit.
          enum:
          - GHz
      dwell_ms:
        required: true
        value:
          type: integer
          unit: ms
          description: Decimal digits, hold after verified tuning.
          minimum: 1
          maximum: 1000
    preconditions:
    - No incompatible tuning or procedure is active.
    - No known blocking hardware fault.
    - All parameters, target sequence and conservative execution budget are valid.
    effects: On success leave rounded stop frequency. Invalidate calibration on effective changes. No
      scientific data acquisition.
    states:
      running: Accepted active execution, including internal phases.
      cancelling: Controlled stop requested; may persist after stop deadline without confirmation.
      succeeded: Actual successful completion.
      failed: Execution failed and stopped.
      cancelled: Accepted cancellation resulted in confirmed stop.
    initial_state: running
    terminal_states:
    - succeeded
    - failed
    - cancelled
    transitions:
    - from: running
      to: succeeded
      condition: All completion conditions verified within execution deadline.
    - from: running
      to: failed
      condition: Execution failure and confirmed stop.
    - from: running
      to: cancelling
      condition: Accepted client cancellation or execution deadline expires.
    - from: cancelling
      to: succeeded
      condition: Actual successful completion wins client cancellation race before execution deadline.
    - from: cancelling
      to: failed
      condition: Confirmed stop after execution timeout or other actual failure.
    - from: cancelling
      to: cancelled
      condition: Accepted client cancellation produces confirmed stop, without a timeout failure.
    outcomes:
      succeeded: All required effects verified. Ten points completed and rounded stop remains applied.
      failed: Report actual error_code, never before verified end. Do not skip failed points; reacquire
        frequency.
      cancelled: Verified stop, no implied restoration. Retain last verified frequency if evidence remains.
    cancellation:
      supported: true
      allowed_states:
      - running
      - cancelling
      semantics: Client cancellation in every active phase. Repeated cancellation while cancelling is
        accepted without extending deadline. See controlled_stop.
    timing:
      deadline_ms: 20000
      completion: Execution deadline, not a guaranteed terminal-state deadline. Includes all required
        work. At expiry initiate controlled stop; after confirmed stop report SCAN_TIMEOUT. Use descriptor
        procedure_stop_timeout_ms; if no stop proof, report STOP_TIMEOUT and remain nonterminal.
    requirements:
    - scan_parameters
    - scan_execution
    - procedure_history
    - controlled_stop
    - concurrency
    - time_quality
    errors:
    - SCAN_TIMEOUT
    - FREQUENCY_LOCK_FAILED
    - INVALID_PARAMETER
    - OUT_OF_RANGE
    - INVALID_TYPE
    - UNSUPPORTED_UNIT
    - BUSY
    - HARDWARE_FAULT
    - MISSING_PARAMETER
    - UNKNOWN_PARAMETER
    - DUPLICATE_PARAMETER
    - NOT_RUNNING
    - STOP_TIMEOUT
errors:
  READ_ONLY_PROPERTY:
    description: Attempt to write read-only property.
    consequence: Reject without hardware effects.
    recovery: Use get.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  INVALID_TYPE:
    description: Incorrect value type.
    consequence: Reject before execution.
    recovery: Correct type.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  OUT_OF_RANGE:
    description: Original value outside declared range.
    consequence: Reject without applying it.
    recovery: Choose in-range value.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  UNSUPPORTED_UNIT:
    description: Unsupported unit.
    consequence: Reject without conversion.
    recovery: Use declared unit.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  INVALID_PARAMETER:
    description: Other parameter constraint violated.
    consequence: Reject before execution; preserve prior outcome.
    recovery: 'Inspect reason: INSUFFICIENT_DISTINCT_POINTS, EXECUTION_BUDGET_EXCEEDED or UNREPRESENTABLE_VALUE.'
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  MISSING_PARAMETER:
    description: Required parameter absent.
    consequence: Reject before execution.
    recovery: Supply required field.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  UNKNOWN_PARAMETER:
    description: Unsupported parameter supplied.
    consequence: Reject before execution.
    recovery: Remove field.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  DUPLICATE_PARAMETER:
    description: Repeated parameter.
    consequence: Reject before execution.
    recovery: Supply each field once.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  BUSY:
    description: Incompatible activity.
    consequence: No new conflicting work is accepted.
    recovery: Inspect state and wait or arrange authorized stop.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  HARDWARE_FAULT:
    description: Known fault prevents this operation.
    consequence: Reject affected operation.
    recovery: Inspect fault and resolve before retry.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  VALUE_UNAVAILABLE:
    description: No valid value is currently available; receiver-specific reasons include CALIBRATING,
      TUNING and UNVERIFIED.
    consequence: No guessed numeric response.
    recovery: Inspect reason and acquire again when valid.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  STATUS_UNAVAILABLE:
    description: Usable status cannot be produced.
    consequence: Do not infer health or activity.
    recovery: Investigate and query again.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  NOT_RUNNING:
    description: Selected procedure not active.
    consequence: Retained outcome unchanged.
    recovery: Inspect status.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  NOT_CANCELLABLE:
    description: Current phase cannot accept cancellation.
    consequence: No stop timer starts.
    recovery: Inspect procedure status.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  FREQUENCY_LOCK_FAILED:
    description: Frequency not applied and verified within budget.
    consequence: No verified result; invalidate calibration if frequency verification is lost; scan cannot
      advance on a failed point.
    recovery: Read actual frequency and status.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  FREQUENCY_READ_FAILED:
    description: Hardware read cannot produce valid frequency.
    consequence: No guessed value.
    recovery: Inspect synthesizer and read diagnostics.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  CALIBRATION_REFERENCE_UNAVAILABLE:
    description: Calibration reference unavailable after acceptance.
    consequence: Failed outcome after verified end; calibration invalid.
    recovery: Restore reference and inspect retained outcome.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  CALIBRATION_TIMEOUT:
    description: Calibration execution deadline exceeded.
    consequence: Controlled stop; failed only after verified end.
    recovery: Inspect status and stop evidence.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  SCAN_TIMEOUT:
    description: Scan execution deadline exceeded.
    consequence: Controlled stop; failed only after verified end.
    recovery: Inspect status and stop evidence.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  SYNTHESIZER_FAILURE:
    description: Confirmed synthesizer fault.
    consequence: Expose active fault; do not rely on lost tuning evidence.
    recovery: Resolve and verify diagnostics.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  STOP_TIMEOUT:
    description: Controlled stop not confirmed by deadline.
    consequence: Expose active fault, block incompatible work and do not fabricate terminal state.
    recovery: Verify actual stop and preserve incident evidence.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
  CLOCK_UNTRUSTED:
    description: UTC clock untrusted on UTC-capable receiver.
    consequence: Omit new unreliable timestamps; retain historical trustworthy ones.
    recovery: Restore clock trust; do not fabricate timestamps.
    specification:
      document: docs/hardware_protocol.md#error-catalog-and-human-readable-logs
      revision: ce04fb587cacd6c3a9df7336442e9d2d9fcfa635
requirements:
  identity:
    statement: Expose the flat read-only configuration descriptor with the exact field names and semantics
      specified by the receiver profile. Identify the apparatus, model, firmware release and unique build,
      independently of protocol version and instance endpoint. Validate identity, compatibility, descriptor
      limits and coherent capability lists before enabling operational writes. No silent fallback for
      this model.
    sources:
    - receiver
    - decisions_6
    status: confirmed
    dependencies: []
  firmware_scope:
    statement: Specify the protocol independently of firmware releases. Record explicitly identified compatible
      firmware versions when their conformance has been verified; the empty list declares no such releases,
      not a wildcard. The fictitious receiver has no verified real firmware. The simulator default label
      0.1.0 is illustrative, not a compatibility claim. Do not enable normal operational writes to physical
      hardware merely because its protocol, model or reported release label matches; verify the actual
      build and conformance. Authorized simulator and exploratory verification remain distinct from production
      compatibility.
    sources:
    - receiver
    - review
    status: confirmed
    dependencies: []
  frequency_range:
    statement: Validate the original unquoted numeric value against the inclusive range before approximating
      to the grid. Require GHz explicitly for set; no unit conversion. Reject strings, booleans, lists,
      missing or unknown fields and unrepresentable values before hardware effects. Use exact decimal
      or equivalent arithmetic; ties go toward the higher frequency.
    sources:
    - receiver
    - decisions_6
    status: confirmed
    dependencies: []
  frequency_write:
    statement: Complete application and verification within the advertised tuning budget. Return ok with
      the verified applied value, never mere acceptance. Changing the effective frequency invalidates
      calibration; an unchanged effective value does not by itself invalidate calibration. Failure to
      lock does not establish either old or requested value; subsequent observations must be truthful.
    sources:
    - receiver
    - decisions_6
    status: confirmed
    dependencies: []
  uncertain_calibration:
    statement: A successful setting of the same effective grid frequency preserves a valid calibration;
      a successful change invalidates it. If application fails and the actual frequency is no longer verified,
      invalidate calibration even for a same-frequency request and report calibrated=false. A later verified
      reading or setting of the same frequency does not restore that calibration; a new successful calibration
      is required. A request rejected before hardware effects leaves calibration validity unchanged.
    sources:
    - receiver
    - review
    status: confirmed
    dependencies: []
  frequency_read:
    statement: Each wire get frequency acquires current hardware state, not a Device cache. Report GHz
      and sampled_at when trustworthy. During calibration report VALUE_UNAVAILABLE/CALIBRATING; during
      a tuning transition without a valid value report VALUE_UNAVAILABLE/TUNING. An attempted unsuccessful
      read reports FREQUENCY_READ_FAILED; do not substitute guessed or cached values.
    sources:
    - receiver
    - decisions_6
    status: confirmed
    dependencies: []
  unverified_reason:
    statement: When tuning is no longer active but its verification evidence has been lost and no valid
      current frequency is available, return VALUE_UNAVAILABLE with reason UNVERIFIED until a reliable
      observation is possible. Do not return the old or requested value as verified. Preserve FREQUENCY_READ_FAILED
      for an attempted acquisition that fails and CALIBRATING or TUNING for those temporary activity conditions.
    sources:
    - receiver
    - review
    status: confirmed
    dependencies: []
  general_status:
    statement: 'General status is a coherent nonmutating snapshot: health ok/fault/unknown, activity idle/calibrating/scanning/unknown,
      calibrated boolean omitted if indeterminate, boot_id, optional trustworthy booted_at, and always-present
      active confirmed fault_codes. No frequency duplication. Confirmed faults take precedence; remove
      only on verified resolution. Idle requires no active procedure and no unconfirmed stop; if activity
      is indeterminate report unknown. STATUS_UNAVAILABLE if a usable snapshot cannot be supplied.'
    sources:
    - receiver
    - decisions_6
    status: confirmed
    dependencies: []
  time_quality:
    statement: Apply protocol timestamp grammar without truncating fractional digits. Preserve historical
      trustworthy timestamps; omit unreliable new ones and expose CLOCK_UNTRUSTED. Frequency acquisition
      time is not receipt time. Use monotonic deadlines. UTC-independent operations may remain available.
      Simulator host UTC is not a physical accuracy guarantee.
    sources:
    - protocol
    - receiver
    - timing
    status: confirmed
    dependencies: []
  concurrency:
    statement: Multiple clients share hardware state. Calibration and scan exclude one another and external
      tuning, including during cancellation and uncertain stop. Reject incompatible requests with BUSY,
      without queueing another procedure. Status remains serviceable. A successful setting is not a reservation;
      request IDs are connection-local, not ownership or procedure IDs.
    sources:
    - protocol
    - receiver
    status: confirmed
    dependencies: []
  short_set_overlap:
    statement: Reject a second set with BUSY while a short frequency setting is still in progress, including
      requests from another client. Do not enqueue or execute the rejected request. A later valid request
      after completion may execute normally.
    sources:
    - protocol
    - receiver
    - review
    status: confirmed
    dependencies: []
  calibration:
    statement: Accept a parameterless calibration only after validation and registration. Invalidate old
      calibration at start, save the starting frequency, control tuning and remain responsive to status.
      Success requires completed calibration, final checks and verified restoration of saved frequency.
      Failure/cancellation leaves calibration invalid and does not guarantee restoration. A known blocking
      fault may reject before acceptance; failure after acceptance is a retained failed outcome once stopped.
    sources:
    - receiver
    - decisions_6
    status: confirmed
    dependencies: []
  scan_parameters:
    statement: Validate all required scan inputs before acceptance. Round both original in-range endpoints
      to the grid; interpolate ten targets including both endpoints with exact rational/decimal or integer
      arithmetic and nearest-ties-up rounding. Require strict monotonicity and distinctness in either
      direction (at least nine grid increments). Reject step or point-count inputs, collapsed ranges and
      conservative budget overflow; budget is scan_points times (max_tuning_ms plus dwell_ms), no greater
      than scan_timeout_ms.
    sources:
    - receiver
    - decisions_6
    status: confirmed
    dependencies: []
  scan_execution:
    statement: Tune and verify each target before holding it for dwell_ms, including the last. Count a
      point only after its hold completes; optional progress reflects completed points, not elapsed time.
      No silent skip on failure. Success leaves the rounded stop frequency; cancellation retains the last
      verified applied frequency when known, otherwise reports unavailability. No automatic restoration
      on failure or cancellation. Changes invalidate calibration; no acquisition or calibration is performed.
    sources:
    - receiver
    - decisions_6
    status: confirmed
    dependencies: []
  procedure_history:
    statement: Register a new accepted attempt before responding; query current or last retained attempt
      by name. Reading status and rejected starts do not clear or replace it. Report unknown if history
      is unavailable and never_started only with positive knowledge. Disconnection does not stop execution
      or withdraw cancellation. Any client may query or cancel current work; do not infer an execution
      identity from request IDs. Preserve started_at/finished_at when trustworthy, error_code on failed
      outcome and optional meaningful progress.
    sources:
    - receiver
    - decisions_6
    status: confirmed
    dependencies: []
  controlled_stop:
    statement: An accepted cancel initiates one controlled stop; repeats do not reset its deadline. Calibration
      finalization rejects client cancellation with NOT_CANCELLABLE and no stop timer, but execution timeout
      still applies. Scan permits cancellation throughout active execution. A race may end in actual success.
      Execution deadline initiates stop; terminal timeout failure requires verified stop. If stop remains
      unconfirmed after the additional five-second budget, expose STOP_TIMEOUT, preserve active/unknown
      activity and block incompatible work; no fabricated terminal/idle state. Later confirmed stop may
      establish outcome and clear active fault while retaining history.
    sources:
    - receiver
    - timing
    - matrix
    status: confirmed
    dependencies: []
  reboot:
    statement: Reboot is a dedicated fieldless lifecycle verb, permitted during active procedures. Prevent
      new operations, transmit complete accepted reply and wait for bounded TCP-stack transmission completion
      before closing/restarting where possible. No additional application acknowledgement. After restart
      generate new opaque 32-character lowercase hexadecimal boot_id, report prior procedure outcomes
      unknown and establish calibration/state from startup checks. No guarantee of previous frequency
      persistence. Compare boot_id after descriptor/status bootstrap; changed identity proves new execution,
      not causation. Never automatically replay reboot.
    sources:
    - receiver
    - recovery
    status: confirmed
    dependencies: []
  wire_limits:
    statement: Use shared protocol v1 framing, validation, reserved diagnostics and request correlation
      without redefining wire grammar. Enforce receiver descriptor message, incomplete-frame and pending
      limits, independent deadlines, no execution of incomplete/oversized requests, no implicit pending
      queue, and no unsolicited completion messages. Reserved duplicate-ID diagnostics cannot consume
      the original pending request.
    sources:
    - protocol
    - timing
    - matrix
    status: confirmed
    dependencies: []
  client_recovery:
    statement: 'Reference shared staged recovery: persistent TCP, one status probe after an ordinary timeout
      where IDs remain, suspend new writes until relevant fresh evidence, reconnect if unusable, bootstrap
      descriptor/status and refresh affected state, never replay modifying requests. Late/foreign/duplicate
      replies are diagnostic evidence, not state updates. Client defaults: response and connection-attempt
      limits 2000 ms, failed-reconnect pause 5000 ms, procedure-status polling 500 ms; these are not firmware
      settings. No global reboot verification timer.'
    sources:
    - recovery
    - timing
    - matrix
    status: confirmed
    dependencies: []
  fault_diagnostics:
    statement: Distinguish validation errors, temporary unavailability, failed execution, active hardware
      faults and communication uncertainty. Preserve symbolic codes and structured context under the shared
      catalog, including unknown codes. Multiple active confirmed conditions may coexist; a successful
      command cannot alone clear an active fault. Fault injection is simulator-only, not a production
      command.
    sources:
    - protocol
    - receiver
    - matrix
    status: confirmed
    dependencies: []
  simulator_scope:
    statement: The receiver is fictitious. Verify contract scenarios against simulator and independent
      wire/state oracles; no physical instrument or live firmware has been verified. The simulator may
      choose nominal timing, startup values and calibration reference details within the approved behavior;
      do not promote these to universal hardware requirements.
    sources:
    - receiver
    - simulator_design
    - matrix
    status: confirmed
    dependencies: []
scenarios:
  descriptor:
    requirements:
    - identity
    - firmware_scope
    - wire_limits
    given: A receiver with known instance identity and declared draft profile.
    when: Connect and get configuration; try malformed, wrong identity, unsupported protocol, arbitrary
      firmware label and read-only set variants. Review compatibility separately from simulator verification.
    then: The complete descriptor matches the declared fields and limits; incompatible descriptors block
      operational writes; configuration set is rejected. A matching protocol and arbitrary nonempty firmware
      label do not establish firmware compatibility. An empty version list makes no compatibility claim.
    level: simulator
  rounding:
    requirements:
    - frequency_range
    - frequency_write
    given: A healthy idle receiver.
    when: Set 1, 10, 5.1234565, equivalent numeric spellings, and values just beyond bounds; try strings,
      booleans, lists, unknown fields and wrong unit.
    then: Return verified 5.123457 for the tie; accept endpoints; reject out-of-range before rounding
      and invalid requests before any physical effect.
    level: simulator
  same_frequency:
    requirements:
    - frequency_write
    - uncertain_calibration
    given: Calibrated receiver with verified frequency.
    when: Send an invalid request rejected before hardware effects; then set the same effective grid value
      and finally a different grid value.
    then: Rejection preserves calibration; successful same-frequency setting preserves it; successful
      changed frequency invalidates it. Both successful replies contain verified values.
    level: simulator
  read_and_lock_failure:
    requirements:
    - frequency_read
    - frequency_write
    - unverified_reason
    - fault_diagnostics
    given: A receiver with verified value, then injected read or tuning failure.
    when: Read, set with lock failure, query frequency after failed tuning and during transition.
    then: Read failure is FREQUENCY_READ_FAILED; failed tune never confirms guessed old/new value; during
      tuning report TUNING; after loss of tuning evidence report UNVERIFIED when no acquisition specifically
      failed, until reliable frequency is available.
    level: simulator
  same_frequency_failed:
    requirements:
    - uncertain_calibration
    - frequency_write
    - general_status
    given: Calibrated receiver at a verified frequency.
    when: Inject lock failure on a same-effective-frequency set; inspect general status, reacquire the
      same verified frequency, inspect status again, and then successfully recalibrate.
    then: The failed set loses frequency verification and reports FREQUENCY_LOCK_FAILED; calibrated=false.
      Reacquisition of the same verified value leaves calibration invalid; only successful recalibration
      restores validity.
    level: simulator
  calibrate_success:
    requirements:
    - calibration
    - frequency_read
    - concurrency
    - procedure_history
    given: Idle verified receiver with a prior valid calibration.
    when: Run calibrate, immediately query status, read/set frequency, try scan, wait for completion and
      query again.
    then: Acceptance registers running, old calibration invalid, read returns CALIBRATING, conflicting
      starts and sets BUSY; success only after final checks and restored frequency, retained without clearing.
    level: simulator
  calibrate_failure:
    requirements:
    - calibration
    - fault_diagnostics
    given: Calibration accepted with a known starting frequency.
    when: Inject reference loss or failure of frequency restoration.
    then: Failed only after execution ends; report applicable error, calibration false; reacquire frequency;
      no fabricated health fault or success.
    level: simulator
  scan_sequence:
    requirements:
    - scan_parameters
    - scan_execution
    given: Idle healthy receiver.
    when: Scan 5 to 5.2 GHz and reverse; also scan minimum nine-grid span; observe every target independently
      and hold duration.
    then: Ten strictly monotonic targets including rounded endpoints; hold after verified tuning including
      last; count only completed holds; final frequency is rounded stop. No data acquisition.
    level: simulator
  scan_reject:
    requirements:
    - scan_parameters
    - procedure_history
    given: A retained prior scan outcome and verified frequency.
    when: Submit collapsed endpoints, out-of-range original inputs, invalid dwell, step or point count,
      missing or wrong-unit input.
    then: Reject before tuning, preserve prior outcome and frequency; check exact symbolic errors and
      budget boundary.
    level: simulator
  scan_failure:
    requirements:
    - scan_execution
    - fault_diagnostics
    given: Scan with one completed point.
    when: Inject lock failure or loss of verified tuning during hold.
    then: Do not credit or skip failed point; report actual failure after stop, no automatic restoration.
    level: simulator
  cancel_phases:
    requirements:
    - controlled_stop
    - calibration
    - scan_execution
    given: Active calibration or scan with independently observable phase.
    when: Cancel calibration before and during finalization, cancel scan during tuning and hold, repeat
      cancel, then query after stop.
    then: Finalization rejects without stop timer; otherwise one stop deadline, actual confirmed terminal
      state, no guaranteed frequency restoration; terminal cancel returns NOT_RUNNING.
    level: simulator
  stop_deadlines:
    requirements:
    - controlled_stop
    - general_status
    given: Active procedure with controllable monotonic clock and unconfirmed-stop fault.
    when: Expire execution deadline including finalization; wait additional stop budget; query status,
      try incompatible work; subsequently confirm stop.
    then: No terminal or idle claim while unconfirmed, STOP_TIMEOUT active, work blocked; later verified
      end records matching timeout failure and active fault clears only on resolution.
    level: simulator
  completion_race:
    requirements:
    - controlled_stop
    - procedure_history
    given: Procedure near actual completion.
    when: Race accepted cancellation against successful completion; also request after terminal outcome.
    then: Actual success may win; late cancellation returns NOT_RUNNING; no fabricated cancelled state.
    level: simulator
  shared_clients:
    requirements:
    - concurrency
    - short_set_overlap
    - procedure_history
    given: Two connected clients with independent IDs.
    when: Overlap short sets, then set sequentially; start scan, disconnect initiator, query/cancel from
      second client.
    then: Overlapping short set returns BUSY without hardware effects or queueing; sequential settings
      apply in order; scan remains queryable and cancellable from second client.
    level: simulator
  clock_and_health:
    requirements:
    - general_status
    - time_quality
    - fault_diagnostics
    given: Verified boot timestamp and frequency.
    when: Inject clock distrust and synthesizer failure together; query status and reads, resolve conditions
      individually.
    then: Both confirmed codes visible; no new unreliable UTC; retain old boot timestamp; no guessed value;
      health follows evidence, not successful status exchange.
    level: simulator
  history_and_reboot:
    requirements:
    - reboot
    - procedure_history
    - general_status
    given: Active calibration or scan with previously observed boot ID.
    when: Reconnect without restart, then explicitly reboot; inspect accepted frame, disconnect, bootstrap
      and status.
    then: Same ID on reconnect; new ID on restart, prior history unknown not cancelled, calibration not
      inherited; complete acceptance before restart under bounded transport policy; no replay.
    level: simulator
  wire_boundaries:
    requirements:
    - wire_limits
    - fault_diagnostics
    given: Raw and conforming clients with controllable transport.
    when: Test fragmented/coalesced frames, 4096 boundary, missing LF deadline, malformed request, invalid/decreasing
      IDs, fifth pending request, reordered and malformed replies.
    then: Apply the independent protocol matrix exactly; no invalid hardware effects or cross-request
      completion, bounded framing and admission.
    level: simulator
  lost_outcomes:
    requirements:
    - client_recovery
    - frequency_read
    - procedure_history
    - reboot
    given: Persistent connection with independently observable applied operation.
    when: Lose set, run, cancel or reboot reply; inject late reply, successful/failed probe, incompatible
      descriptor and ID exhaustion.
    then: Keep outcome uncertain, probe once where possible, refresh affected property/procedure or boot
      identity, reconnect as specified and never replay. No stale cache or fabricated state.
    level: simulator
  simulator_boundary:
    requirements:
    - simulator_scope
    given: Fictitious receiver simulator and no physical hardware.
    when: Execute applicable independent simulator tests including fault injection.
    then: Report simulator evidence separately from physical verification; no live hardware claim; faults
      remain separate from operational wire interface.
    level: simulator
dependencies: {}
